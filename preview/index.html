<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Receipt</title>
<style>
:root{--page:#f3f3f3;--hint:#6b6b6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#1b1b1b;--hint:#a0a0a0}}
:root[data-theme="dark"]{--page:#1b1b1b;--hint:#a0a0a0}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--page);font-family:Inter,-apple-system,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:0}
.screen{width:100%;max-width:430px;min-height:100vh;background:#fff;color:#000;display:flex;flex-direction:column;justify-content:space-between;padding:24px}
.top{margin-top:60px}
.badge{width:56px;height:56px;border-radius:50%;background:#5CD65C;display:flex;align-items:center;justify-content:center}
h1{margin:28px 0 0;font-size:22px;font-weight:700;color:#000;text-align:left}
.pill{width:100%;height:52px;margin-bottom:24px;border:0;border-radius:9999px;background:#18D458;color:#fff;font:600 16px/1 inherit;font-family:inherit;cursor:pointer;transition:background .5s,transform .1s}
.pill:active{transform:scale(.98)}
.pill.failed{background:#E5484D}
.badge{cursor:pointer;-webkit-tap-highlight-color:transparent}
#msg.editing{outline:2px solid #5CD65C;outline-offset:6px;border-radius:6px}
.hint{font-size:13px;color:var(--hint);margin:0 0 16px;text-align:center}
@media (min-width:600px){
 .wrap{padding:32px 0}
 .screen{min-height:860px;border-radius:28px;border:1px solid #ddd;box-shadow:0 10px 40px rgba(0,0,0,.15)}
}
</style>
</head>
<body>
<div class="wrap">
 <main class="screen">
  <section class="top">
   <div class="badge" id="badge" role="button" tabindex="0" aria-label="Edit message">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
   </div>
   <h1 id="msg">hi this is a demo app</h1>
  </section>
  <button class="pill" id="pill" type="button">Pending</button>
 </main>
 <p class="hint">Preview: tap the circle to edit the text, tap the green button to change the status.</p>
</div>
<script>
(function(){
 var KEY="receipt-demo-status",LABEL={PENDING:"Pending",COMPLETED:"Completed",FAILED:"Failed"};
 var status="PENDING",pill=document.getElementById("pill");
 function read(){try{var v=localStorage.getItem(KEY);return LABEL[v]?v:null}catch(e){return null}}
 function write(v){try{localStorage.setItem(KEY,v)}catch(e){}}
 function render(){pill.textContent=LABEL[status];pill.classList.toggle("failed",status==="FAILED")}
 function sync(){var v=read();if(v&&v!==status){status=v;render()}}
 pill.addEventListener("click",function(){status=status==="PENDING"?"COMPLETED":"PENDING";write(status);render()});
 var MKEY="receipt-demo-message",msg=document.getElementById("msg"),badge=document.getElementById("badge"),hint=document.querySelector(".hint"),editing=false,DEF="hi this is a demo app";
 try{var m=localStorage.getItem(MKEY);if(m)msg.textContent=m}catch(e){}
 function toggleEdit(){
  editing=!editing;
  if(editing){msg.contentEditable="true";msg.classList.add("editing");msg.focus();var r=document.createRange();r.selectNodeContents(msg);var s=getSelection();s.removeAllRanges();s.addRange(r);hint.textContent="Editing: tap the circle again to save."}
  else{msg.contentEditable="false";msg.classList.remove("editing");var t=msg.textContent.trim().slice(0,200)||DEF;msg.textContent=t;try{localStorage.setItem(MKEY,t)}catch(e){}hint.textContent="Preview: tap the circle to edit the text, tap the green button to change the status."}
 }
 badge.addEventListener("click",toggleEdit);
 badge.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();toggleEdit()}});
 msg.addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();toggleEdit()}});
 setInterval(sync,3000);
 sync();render();
})();
</script>
</body>
</html>
